<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <linearGradient id="phone-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF5722" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Phone body -->
  <rect x="40" y="20" width="240" height="440" rx="32" fill="#1E293B" filter="url(#shadow)"/>
  <rect x="48" y="28" width="224" height="424" rx="26" fill="#0f172a"/>
  <!-- Screen content -->
  <rect x="56" y="56" width="208" height="368" rx="12" fill="#1e293b"/>
  <!-- Status bar -->
  <text x="72" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">9:41</text>
  <circle cx="248" cy="76" r="4" fill="#22c55e"/>
  <!-- App header -->
  <text x="72" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Voice Recording</text>
  <text x="72" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Yoruba Language Task</text>
  <!-- Waveform visualization -->
  <g transform="translate(72, 160)">
    <!-- Waveform bars -->
    <rect x="0" y="30" width="4" height="20" rx="2" fill="url(#wave1)"/>
    <rect x="8" y="20" width="4" height="40" rx="2" fill="url(#wave1)"/>
    <rect x="16" y="10" width="4" height="60" rx="2" fill="url(#wave1)"/>
    <rect x="24" y="5" width="4" height="70" rx="2" fill="#ffffff"/>
    <rect x="32" y="0" width="4" height="80" rx="2" fill="#ffffff"/>
    <rect x="40" y="8" width="4" height="64" rx="2" fill="#ffffff"/>
    <rect x="48" y="18" width="4" height="44" rx="2" fill="url(#wave1)"/>
    <rect x="56" y="25" width="4" height="30" rx="2" fill="url(#wave1)"/>
    <rect x="64" y="15" width="4" height="50" rx="2" fill="url(#wave1)"/>
    <rect x="72" y="5" width="4" height="70" rx="2" fill="#ffffff"/>
    <rect x="80" y="2" width="4" height="76" rx="2" fill="#ffffff"/>
    <rect x="88" y="10" width="4" height="60" rx="2" fill="url(#wave1)"/>
    <rect x="96" y="22" width="4" height="36" rx="2" fill="url(#wave1)"/>
    <rect x="104" y="28" width="4" height="24" rx="2" fill="url(#wave1)"/>
    <rect x="112" y="18" width="4" height="44" rx="2" fill="url(#wave1)"/>
    <rect x="120" y="8" width="4" height="64" rx="2" fill="#ffffff"/>
    <rect x="128" y="3" width="4" height="74" rx="2" fill="#ffffff"/>
    <rect x="136" y="12" width="4" height="56" rx="2" fill="url(#wave1)"/>
    <rect x="144" y="20" width="4" height="40" rx="2" fill="url(#wave1)"/>
    <rect x="152" y="30" width="4" height="20" rx="2" fill="url(#wave1)"/>
  </g>
  <!-- Progress bar -->
  <rect x="72" y="270" width="176" height="6" rx="3" fill="#334155"/>
  <rect x="72" y="270" width="110" height="6" rx="3" fill="#FF5722"/>
  <!-- Time indicators -->
  <text x="72" y="296" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">1:24</text>
  <text x="220" y="296" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">3:00</text>
  <!-- Record button -->
  <circle cx="160" cy="340" r="28" fill="none" stroke="#FF5722" stroke-width="3"/>
  <circle cx="160" cy="340" r="20" fill="#FF5722"/>
  <!-- Earning badge floating -->
  <g transform="translate(200, 140)">
    <rect x="0" y="0" width="90" height="32" rx="16" fill="#22c55e" opacity="0.95"/>
    <text x="45" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+N850</text>
  </g>
  <!-- Second earning badge -->
  <g transform="translate(10, 200)">
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#FF5722" opacity="0.9"/>
    <text x="40" y="19" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Recording</text>
  </g>
</svg>
